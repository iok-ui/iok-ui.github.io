<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>What has Io̍k-uí done?</title>

  <style>
    body {
      margin: 0;
      background: #ffffff;
      color: #111111;
      font-family: Helvetica, Arial, sans-serif;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 4rem 2rem;
    }

    .back {
      color: #777777;
      text-decoration: none;
    }

    .back:hover {
      color: #111111;
    }

    h1 {
      margin: 3rem 0 0.8rem;
      font-size: 2.4rem;
      font-weight: 400;
    }

    .intro {
      max-width: 680px;
      color: #666666;
      line-height: 1.6;
      margin-bottom: 3rem;
    }

    .date-section {
      margin-bottom: 3.5rem;
    }

    .date-title {
      margin: 0 0 1.2rem;
      font-size: 1.5rem;
      font-weight: 400;
    }

    .activity {
      display: flex;
      gap: 1rem;
      padding: 1rem 0;
      border-bottom: 1px solid #eeeeee;
    }

    .tag {
      min-width: 102px;
      height: fit-content;
      box-sizing: border-box;
      padding: 0.35rem 0.55rem;
      border-radius: 999px;
      font-size: 0.75rem;
      text-align: center;
      color: white;
    }

    .project {
      background: #f2994a;
    }

    .coordination {
      background: #4285f4;
    }

    .admin {
      background: #9e9e9e;
    }

    .hosting {
      background: #2e7d32;
    }

    .other {
      background: #777777;
    }

    .activity-text {
      line-height: 1.55;
    }

    .project-name {
      color: #666666;
      font-size: 0.88rem;
      margin-top: 0.25rem;
    }

    .read-more {
      margin-top: 1rem;
      border: 1px solid #dddddd;
      background: white;
      border-radius: 999px;
      padding: 0.7rem 1.1rem;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .read-more:hover {
      border-color: #111111;
    }

    .empty {
      color: #777777;
    }

    @media (max-width: 700px) {
      .container {
        padding: 3rem 1rem;
      }

      h1 {
        font-size: 2.2rem;
      }

      .activity {
        gap: 0.7rem;
      }

      .tag {
        min-width: 76px;
        font-size: 0.68rem;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <a class="back" href="/">← Home</a>

    <h1>What has Io̍k-uí done?</h1>

    <p class="intro">
      A short public log of research, coordination, administration, and practical work.
    </p>

    <div id="activityLog"></div>

    <button class="read-more" id="readMore" style="display: none;">
      Read more
    </button>
  </div>

  <script>
    let groupedActivities = [];
    let showAll = false;

    const categoryLabels = {
      project: "Project",
      coordination: "Coordination",
      admin: "Admin",
      hosting: "Hosting"
    };

    function formatDate(dateString) {
      const [year, month, day] = dateString.split("-").map(Number);

      return new Date(year, month - 1, day).toLocaleDateString("en-GB", {
        day: "numeric",
        month: "long",
        year: "numeric"
      });
    }

    function groupByDate(activities) {
      const groups = new Map();

      activities.forEach(activity => {
        if (!groups.has(activity.date)) {
          groups.set(activity.date, []);
        }

        groups.get(activity.date).push(activity);
      });

      return [...groups.entries()]
        .map(([date, items]) => ({ date, items }))
        .sort((a, b) => b.date.localeCompare(a.date));
    }

    function render() {
      const container = document.getElementById("activityLog");
      const readMore = document.getElementById("readMore");

      container.innerHTML = "";

      const visibleGroups = showAll
        ? groupedActivities
        : groupedActivities.slice(0, 7);

      if (visibleGroups.length === 0) {
        container.innerHTML = `<p class="empty">No activity entries yet.</p>`;
        return;
      }

      visibleGroups.forEach(group => {
        const section = document.createElement("section");
        section.className = "date-section";

        const title = document.createElement("h2");
        title.className = "date-title";
        title.textContent = formatDate(group.date);

        section.appendChild(title);

        group.items.forEach(activity => {
          const row = document.createElement("div");
          row.className = "activity";

          const tag = document.createElement("div");
          const category = activity.category || "other";

          tag.className = `tag ${category}`;
          tag.textContent = categoryLabels[category] || "Other";

          const textBlock = document.createElement("div");
          textBlock.className = "activity-text";
          textBlock.textContent = activity.text;

          if (activity.project) {
            const project = document.createElement("div");
            project.className = "project-name";
            project.textContent = activity.project;
            textBlock.appendChild(project);
          }

          row.appendChild(tag);
          row.appendChild(textBlock);
          section.appendChild(row);
        });

        container.appendChild(section);
      });

      if (groupedActivities.length > 7) {
        readMore.style.display = "inline-block";
        readMore.textContent = showAll ? "Show less" : "Read more";
      }
    }

    document.getElementById("readMore").addEventListener("click", () => {
      showAll = !showAll;
      render();

      if (!showAll) {
        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });
      }
    });

    fetch("/content/activities.json")
      .then(response => response.json())
      .then(activities => {
        groupedActivities = groupByDate(activities);
        render();
      })
      .catch(() => {
        document.getElementById("activityLog").innerHTML =
          `<p class="empty">Unable to load activities.</p>`;
      });
  </script>
</body>
</html>
